<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Trips</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
<img alt ="logo" th:src="@{/images/logo.png}" width="136" height="136">
  <h1>Roles</h1>
  <table class = "table table-hoover">
  	<tr>
  		<td>id</td>
  		<td>nombre</td>
  		<td>Fecha publicacion</td>
  		<td>Descripcion</td>
  	</tr>
  	<tr th:each="rol : ${rol}">
  		<td th:text="${rol.id}"></td>
  		<td th:text="${rol.nombre}"></td>
  		<td th:text="${rol.fecha}"></td>
  		<td th:text="${rol.descripción}"></td>
  		<!--<td th:text="${rol.activo == 1? 'Si' : 'No'}"></td>-->
  		<td>
  			<span th:if="${rol.activo == 1}" class = "badge bg-success" >Si</span>
  			<span th:unless="${rol.activo == 1}" class = "badge bg-danger" >No</span>
  		</td>
  	</tr>
  </table>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
